[project]
name = "ai07-course-recommender"
version = "0.1.0"
description = "AI-07 Explainable Course Recommender — rule-based, explainable course recommendations (SE2026-T24)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.21",
]

# Source lives in src/backend (required repository structure); tests in test/.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-q"
