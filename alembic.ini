# Alembic: schema migrations for PostgreSQL (docs/architecture/data-model.md, section 9).
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding (cp1252 on Windows).
# The database URL is never written here: migrations/env.py reads DATABASE_URL like src/data/db/build.py.
# Run:  python -m tools.migrate        (upgrade the database to the latest schema, keeping all data)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
